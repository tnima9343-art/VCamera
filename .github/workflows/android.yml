
name: Build VCamera APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;31.0.0"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-7.0.2-bin.zip -o gradle.zip
          unzip -q gradle.zip

      - name: Build APK
        run: |
          ./gradle-7.0.2/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VCamera-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
